name: wallybot

x-app: &app
  build:
    context: .
    dockerfile: docker/api.Dockerfile
    target: runtime
  image: wallybot-api:0.1.0
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &environment
    WALLY_ENVIRONMENT: ${WALLY_ENVIRONMENT:-local}
    WALLY_ORIGIN: ${WALLY_ORIGIN:-http://localhost:3333}
    WALLY_COOKIE_SECURE: ${WALLY_COOKIE_SECURE:-false}
  depends_on:
    migrate: {condition: service_completed_successfully}
  networks: [operational]

services:
  postgres:
    build: {context: ., dockerfile: docker/postgres.Dockerfile}
    image: wallybot-postgres:0.1.0
    restart: unless-stopped
    mem_limit: 2g
    environment:
      POSTGRES_DB: wallybot
      POSTGRES_USER: wally_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
    secrets:
      [owner_password, api_password, worker_password, scheduler_password, research_password,
       ai_password]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    # `edge` added solely so Docker Desktop's port-forwarding proxy has a non-internal path to
    # this container -- confirmed by direct testing that an `internal: true`-only network
    # (operational/research) cannot be reached by the host's published-port proxy on this
    # Docker Desktop/WSL2 setup at all (also silently true, pre-existing, of the equally
    # loopback-only Prometheus/Grafana ports). Being on `edge` does not, by itself, expose
    # Postgres to the internet -- only an explicit `ports:` entry does that, and this one is
    # loopback-only; every real access boundary here is still the DB role/password grants, per
    # SECURITY.md's own "network membership alone is not an authorization boundary" stance.
    networks: [operational, research, edge]
    # Loopback-only, unlike every other network path to Postgres: apps/ai_worker runs natively
    # on the host (not a container -- it needs the user's own locally-installed, already-
    # authenticated claude/codex CLI), so it can't reach the operational/research Docker
    # networks and needs a real port. No override var here, unlike gateway's WALLY_BIND_IP --
    # this must never be reachable from outside the host. Host port 5433, not 5432: this
    # machine already has a separate, unrelated native Postgres service bound to 5432.
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wally_owner -d wallybot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    user: redis
    mem_limit: 512m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [sh, /redis-start.sh]
    secrets: [redis_password]
    volumes: ["./docker/redis.sh:/redis-start.sh:ro"]
    networks: [operational]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
    secrets:
      - {source: owner_database_url, target: database_url}
      - encryption_key
      - bootstrap_token
    mem_limit: 512m

  api:
    <<: *app
    environment:
      <<: *environment
      WALLY_LIVE_CAPABLE: ${WALLY_LIVE_CAPABLE:-true}
    # glibc runtime so duckdb (Phase 5 backtesting) installs from a wheel instead of compiling
    # from musl source -- see docker/api.Dockerfile's "research variant" comment and ADR-012.
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime-research
    image: wallybot-api-research:0.1.0
    mem_limit: 1g
    secrets:
      - {source: api_database_url, target: database_url}
      - redis_url
      - encryption_key
      - bootstrap_token
    volumes:
      - historical_data:/data/historical
    networks: [edge, operational]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10

  worker:
    <<: *app
    command: [python, -m, apps.worker]
    mem_limit: 2g
    cpu_shares: 1024
    secrets:
      - {source: worker_database_url, target: database_url}
      - redis_url
    healthcheck:
      test: [CMD, python, -c, "import time,pathlib; assert time.time()-int(pathlib.Path('/tmp/wally-worker.heartbeat').read_text())<30"]
      interval: 10s
      timeout: 3s
      retries: 5

  scheduler:
    <<: *app
    command: [python, -m, apps.scheduler]
    mem_limit: 256m
    secrets:
      - {source: scheduler_database_url, target: database_url}
      - redis_url
    healthcheck:
      test: [CMD, python, -c, "import time,pathlib; assert time.time()-int(pathlib.Path('/tmp/wally-scheduler.heartbeat').read_text())<30"]
      interval: 10s
      timeout: 3s
      retries: 5

  research:
    <<: *app
    command: [python, -m, apps.research_worker]
    # Same glibc runtime as api, for the same duckdb reason -- research_worker is this
    # dependency group's namesake process.
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime-research
    image: wallybot-api-research:0.1.0
    mem_limit: 4g
    cpus: 1
    cpu_shares: 128
    pids_limit: 64
    volumes:
      - historical_data:/data/historical:ro
    environment:
      <<: *environment
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    secrets:
      - {source: research_database_url, target: database_url}
    networks: [research]
    healthcheck:
      test: [CMD, python, -c, "import time,pathlib; assert time.time()-int(pathlib.Path('/tmp/wally-research.heartbeat').read_text())<30"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: {context: ., dockerfile: docker/web.Dockerfile}
    restart: unless-stopped
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build: {context: ., dockerfile: docker/gateway.Dockerfile}
    image: wallybot-gateway:0.1.0
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["${WALLY_BIND_IP:-0.0.0.0}:3333:3333"]
    volumes: ["./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3333/health/ready]
      interval: 10s
      timeout: 6s
      retries: 5

  # Optional (DEPLOYMENT.md: "Optional monitoring profile starts Prometheus/Grafana") -- not
  # started by a bare `docker compose up -d`, only `docker compose --profile monitoring up -d`.
  # Scrapes api:8000/api/metrics directly over the internal `operational` network -- that route
  # is unauthenticated (Prometheus can't hold a session cookie) and deliberately unreachable from
  # the public edge (docker/gateway.conf blocks it). Bound to loopback only: Prometheus's own web
  # UI has no built-in authentication.
  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [operational]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/healthy]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional, same `monitoring` profile as prometheus above. Bound to loopback only, same
  # reasoning as prometheus -- reach it via SSH port-forwarding on a remote host, same as this
  # repo's other localhost-only admin surfaces. Provisioned read-only (datasource + the one
  # starter dashboard); admin password is a generated secret, not a default.
  grafana:
    image: grafana/grafana:11.4.0
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
    secrets: [grafana_admin_password]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    networks: [operational]
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres:
  historical_data:
  prometheus_data:
  grafana_data:
networks:
  edge:
  operational: {internal: true}
  research: {internal: true}
secrets:
  grafana_admin_password: {file: .secrets/grafana_admin_password}
  owner_password: {file: .secrets/owner_password}
  api_password: {file: .secrets/api_password}
  worker_password: {file: .secrets/worker_password}
  scheduler_password: {file: .secrets/scheduler_password}
  research_password: {file: .secrets/research_password}
  ai_password: {file: .secrets/ai_password}
  redis_password: {file: .secrets/redis_password}
  owner_database_url: {file: .secrets/owner_database_url}
  api_database_url: {file: .secrets/api_database_url}
  worker_database_url: {file: .secrets/worker_database_url}
  scheduler_database_url: {file: .secrets/scheduler_database_url}
  research_database_url: {file: .secrets/research_database_url}
  redis_url: {file: .secrets/redis_url}
  encryption_key: {file: .secrets/encryption_key}
  bootstrap_token: {file: .secrets/bootstrap_token}
